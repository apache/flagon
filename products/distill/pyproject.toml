[project]
name = "flagon-distill"
version = "0.1.0"
description = "An analytics framework for front-end UserALE data, enabling modeling, sequence analysis, and customization in Python."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<4.0"
authors = [{ name = "Apache Flagon", email = "dev@flagon.apache.org" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Web Environment",
    "Topic :: Internet :: Log Analysis",
]
dependencies = [
    "networkx>=2.5",
    "numpy>=1.24.3",
    "pandas>=1.5.0,<3.0.0",
    "plotly>=5.5.0",
    "matplotlib>=3.7.5",
    "scipy>=1.9.3",
    "pydantic>=2.7.4",
    "dateparser>=1.2.0",
    "pksuid>=1.1.2",
]

[project.urls]
Homepage = "https://flagon.apache.org/"
Documentation = "https://flagon.apache.org/distill/"
Repository = "https://github.com/apache/flagon.git"

[dependency-groups]
test = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
    "pytest-dotenv>=0.5.2",
    "pytest-mock>=3.10.0",
]
lint = [
    "ruff>=0.8.0",
    "black>=24.0.0",
    "mypy>=1.11.0",
    "types-pyyaml>=6.0.12",
    "types-toml>=0.10.8",
    "pandas-stubs>=2.0.1",
    "codespell>=2.2.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "ipykernel>=6.29.4",
    "jupyter>=1.0.0",
]

#
# Changelog, versioning, and commit management
#
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
version = "0.1.0"
gpg_sign = true
version_files = ["pyproject.toml:version", "distill/__version__.py"]

#
# Linting & Formatting
#
[tool.ruff]
exclude = ["tests/data/", ".github/", "docs/", "examples/"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
]

[tool.black]
line-length = 88
preview = true

[tool.mypy]
ignore_missing_imports = false
disallow_untyped_defs = false
exclude = ["tests/data/", ".github/", "docs/", "examples/", "Dashboard"]
[[tool.mypy.overrides]]
module = "plotly.*"
ignore_errors = true

#
# Testing
#
[tool.coverage.run]
omit = ["tests/*", "Dashboard/*", "docs/*", "examples/*"]

[tool.pytest.ini_options]
addopts = "-s --strict-markers --ignore=build --ignore=dist --ignore=docs --junitxml=test-report.xml"
norecursedirs = "docs docker example build *.eggs *env* .git"
testpaths = "tests distill"
markers = [
    "unit: Unit tests are fast and only test a single module.",
    "pylint: Run linter",
    "integration: Integration tests integrate several modules or integrate with the OS.",
    "interactive: Interactive tests require interaction with the user to complete.",
    "requires_user_action: Test cannot run without user interaction.",
    "requires_user_validation: Test cannot validate without user interaction, but can run for sanity.",
    "only_interactive: This test can only be run in interactive mode.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distill"]

