receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        # Browser CORS configuration required when shipping logs directly from UserALE.js
        cors:
          allowed_origins:
            - "*"
          allowed_headers:
            - "Content-Type"
            - "Authorization"
            - "x-api-key"
            - "traceparent"
            - "tracestate"
          max_age: 7200

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

  # Optional OpenTelemetry Transformation Language (OTTL) processor showing how
  # stock otelcol-contrib can enrich or normalize Flagon UserALE OTLP logs
  # without requiring a custom Go receiver plugin.
  transform/flagon:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["loki.attribute.labels"], "event.name, flagon.log_type, flagon.event_type, flagon.target, user.id")
      - context: resource
        statements:
          - set(attributes["loki.resource.labels"], "service.name, session.id")

exporters:
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: normal

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [transform/flagon, batch]
      exporters: [otlphttp/loki, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
