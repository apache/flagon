name: Distill CI test suite
run-name: ${{ github.actor }} running Distill CI test suite

on:
  push:
    branches:
      - master
    paths:
      - products/distill/**
      - .github/workflows/distill_ci.yml
  pull_request:
    branches:
      - master
    paths:
      - products/distill/**
      - .github/workflows/distill_ci.yml

defaults:
  run:
    working-directory: ./products/distill

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --group test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest



