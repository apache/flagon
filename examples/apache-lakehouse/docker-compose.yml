services:
  # Official Apache Kafka GraalVM native image in KRaft mode (zero ZooKeeper, <1s startup, Apache-2.0)
  kafka:
    image: apache/kafka-native:3.8.0
    container_name: flagon-apache-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Official Apache Iceberg REST Catalog backed by a local warehouse volume (Apache-2.0)
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.7.0
    container_name: flagon-apache-iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: file:///var/lib/iceberg/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.hadoop.HadoopFileIO
    volumes:
      - iceberg-warehouse:/var/lib/iceberg/warehouse

  # OpenTelemetry Collector receiving UserALE OTLP/JSON and streaming to Apache Kafka + local lakehouse volume
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: flagon-lakehouse-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - lakehouse-staging:/var/lib/flagon-lakehouse
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP (/v1/logs, /v1/traces)
    depends_on:
      - kafka
      - iceberg-rest

volumes:
  iceberg-warehouse:
  lakehouse-staging:
