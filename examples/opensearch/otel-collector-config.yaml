receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"
          allowed_headers:
            - "Content-Type"
            - "Authorization"
            - "x-api-key"
            - "traceparent"
            - "tracestate"
          max_age: 7200

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  opensearch/logs:
    http:
      endpoint: http://opensearch:9200
      tls:
        insecure: true
    logs_index: flagon-userale-logs

  opensearch/traces:
    http:
      endpoint: http://opensearch:9200
      tls:
        insecure: true
    traces_index: flagon-userale-traces

  debug:
    verbosity: normal

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch/logs, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [opensearch/traces, debug]
