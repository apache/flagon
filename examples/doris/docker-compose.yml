services:
  doris-fe:
    image: apache/doris:fe-2.1.7
    container_name: flagon-doris-fe
    hostname: doris-fe
    environment:
      - FE_ID=1
      - FE_SERVERS=fe1:172.28.0.10:9010
      - FE_ADDR=172.28.0.10:9010
      - FE_CONF_priority_networks=172.28.0.0/16
    ports:
      - "8030:8030" # Doris FE HTTP port (Stream Load & Web UI)
      - "9030:9030" # Doris FE MySQL protocol port (SQL DDL & queries)
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/meta
    networks:
      doris-net:
        ipv4_address: 172.28.0.10

  doris-be:
    image: apache/doris:be-2.1.7
    container_name: flagon-doris-be
    hostname: doris-be
    depends_on:
      - doris-fe
    environment:
      - FE_SERVERS=fe1:172.28.0.10:9010
      - BE_CONF_priority_networks=172.28.0.0/16
      - BE_ID=1
      - BE_ADDR=172.28.0.20:9050
    ports:
      - "8040:8040" # Doris BE HTTP port
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
    networks:
      doris-net:
        ipv4_address: 172.28.0.20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: flagon-doris-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP (/v1/logs, /v1/traces)
    depends_on:
      - doris-fe
      - doris-be
    networks:
      - doris-net

networks:
  doris-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  doris-fe-meta:
  doris-be-storage:
